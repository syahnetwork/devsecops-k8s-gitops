name: GitOps Multi-Environment Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: gitops-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare & Validate Manifests
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch full history so we can inspect refs

      - name: Debug repo state #move k8s to root folder
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== ls -la (workspace root) ==="
          ls -la
          echo "=== git remote -v ==="
          git remote -v
          echo "=== git log -1 ==="
          git log -1 --oneline
          echo "=== git branch -a ==="
          git branch -a
          echo "=== git ls-files (first 50) ==="
          git ls-files | head -50
          echo "=== git ls-files k8s/ ==="
          git ls-files k8s/ || echo "NO k8s IN GIT INDEX"
          echo "=== ls -la k8s/ ==="
          ls -la k8s/ || echo "NO k8s DIRECTORY ON DISK"

      - name: Generate image tag
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Validate Kubernetes manifests
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ls -la ../..
          pwd
          ls -la ../
          pwd
          ls -l
          ls -l k8s/
          ./kubeconform -strict -summary k8s/

  deploy-staging:
    name: Deploy to Staging
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Create Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-cluster

      - name: Deploy to Staging cluster
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ needs.prepare.outputs.image_tag }}|g" k8s/deployment.yaml
          # kubectl apply -f k8s/ --namespace staging
          # Create the staging namespace first (Namespace objects are cluster-scoped)
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/ --namespace staging --validate=false
          kubectl get pods -n staging
          kubectl describe pod -n staging -l app=myapp
          kubectl get events -n staging --sort-by='.lastTimestamp'

          kubectl rollout status deployment/myapp --namespace staging --timeout=120s

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Create Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-cluster

      - name: Deploy to Production cluster
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ needs.prepare.outputs.image_tag }}|g" k8s/deployment.yaml
          kubectl apply -f k8s/namespace.yaml

          kubectl apply -f k8s/ --namespace production
          kubectl get pods -n production
          kubectl describe pod -n production -l app=myapp
          kubectl get events -n production --sort-by='.lastTimestamp'
          kubectl rollout status deployment/myapp --namespace production --timeout=300s

  #     - name: Health check
  #       run: |
  #         curl --fail --retry 3 --retry-delay 5 --max-time 10 https://example.com/health
